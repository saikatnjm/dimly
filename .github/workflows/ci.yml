name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 pyflakes3 shellcheck \
            appstream desktop-file-utils

      - name: Python checks
        run: python3 -m pyflakes src tests

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Extension syntax
        run: |
          node --check extension/gnome42/extension.js
          node --check extension/cinnamon/applet.js
          cp extension/gnome45/extension.js /tmp/gnome45.mjs && node --check /tmp/gnome45.mjs

      - name: Shell scripts
        run: shellcheck install.sh uninstall.sh packaging/build-deb.sh

      - name: App metadata
        run: |
          appstreamcli validate --no-net data/*.metainfo.xml
          sed 's|@BINDIR@|/usr/bin|' data/io.github.saikatnjm.Dimly.desktop.in > /tmp/dimly.desktop
          desktop-file-validate /tmp/dimly.desktop

      - name: Build the package
        run: ./packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dimly-deb
          path: dist/*.deb

  release:
    # Tagging vX.Y.Z builds the .deb and attaches it to that release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app's version
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/about.py)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but VERSION is $version"; exit 1; }

      - name: Build the package
        run: ./packaging/build-deb.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Dimly ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
